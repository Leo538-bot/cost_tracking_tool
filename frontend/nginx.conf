# The real visitor address. Behind the Cloudflare tunnel the peer is cloudflared,
# so its address says nothing; Cloudflare puts the visitor in CF-Connecting-IP.
# On a plain LAN that header is absent and the socket peer is the visitor.
map $http_cf_connecting_ip $real_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to scanners.
    server_tokens off;

    # Receipt photos are the big payload here; keep headroom above the API's own limit.
    client_max_body_size 20m;
    # Slow-loris protection: a client that dawdles over the headers gets dropped.
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Declared once at server level so every location inherits them. Careful: an
    # add_header inside a location would drop this whole set, so the locations
    # below use `expires` for cache control instead of add_header.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Ignored over plain HTTP, honoured once Cloudflare terminates TLS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # No external origins are used at all. blob:/data: cover receipt previews,
    # and 'unsafe-inline' for styles is required by React's style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Hashed asset filenames may be cached forever.
    location /assets/ {
        expires 1y;
    }

    location /api/ {
        # Resolve the API at request time, not at startup. With a literal
        # hostname nginx refuses to boot when the name is momentarily
        # unresolvable ("host not found in upstream"), which leaves the whole
        # site down instead of just the API. Going through a variable defers
        # the lookup to Docker's embedded DNS, so nginx always starts and the
        # API simply answers 502 until it is up.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets these too; hide the upstream copy so each is sent once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # Uploading a photo over hotel wifi can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Single-page app: unknown paths fall back to the shell, never a 404.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
